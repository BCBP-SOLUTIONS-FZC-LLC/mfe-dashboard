server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The shell loads remoteEntry.js and its chunks with crossorigin="anonymous" and integrity, so
    # they carry CORS. The entry must revalidate; the hashed chunks next to it are immutable.
    location = /remoteEntry.js {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location ~ "^/[0-9a-z_-]+\.[0-9a-f]{16}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
