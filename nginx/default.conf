server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/security-headers.conf;
        return 200 "ok\n";
    }

    # The shell loads remoteEntry.js and its chunks with crossorigin="anonymous" and integrity, so
    # they carry CORS. The entry must revalidate; the hashed chunks next to it are immutable.
    location = /remoteEntry.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location ~ "^/[0-9a-z_-]+\.[0-9a-f]{16}\.(js|css)$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/document-headers.conf;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/document-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
