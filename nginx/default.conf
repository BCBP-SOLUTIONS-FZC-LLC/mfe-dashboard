server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/security-headers.conf;
        return 200 "ok\n";
    }

    # The shell loads remoteEntry.js and its chunks with crossorigin="anonymous" and integrity, so
    # they carry CORS. The entry must revalidate; the hashed chunks next to it are immutable.
    # Served from another origin than the shell (dev), every remote asset also sends
    # Cross-Origin-Resource-Policy: cross-origin (platform-reactcommon examples/cloudfront README, "A remote
    # on another origin"). Access-Control-Allow-Origin is "*", not one shell's origin: the loads carry
    # no credentials, and this image does not know which shell loads it.
    location = /remoteEntry.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        try_files $uri =404;
    }

    location ~ "^/[0-9a-z_-]+\.[0-9a-f]{16}\.(js|css)$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        try_files $uri =404;
    }

    # The standalone page's SDK runtime config (src/standalone.ts). Each environment mounts its own
    # file over the default one (auth.signInUrl sets where logout goes). Never the SPA fallback: a
    # missing file is a 404, not index.html.
    location = /config/runtime.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/document-headers.conf;
    }

    # ^~: a prefix match that the regex locations below never override.
    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        try_files $uri =404;
    }

    # The platform's SPA rule, as CloudFront applies it (platform-reactcommon
    # examples/cloudfront/spa-rewrite.js): only a path whose last segment has no static-asset extension
    # is an app route and gets index.html. A missing script, stylesheet, image, font or JSON file, and
    # anything under the platform's pass-through prefixes, stays 404, so the browser and the SDK see a
    # real error instead of an HTML page. A dot alone does not make a file (/users/john.doe is a route).
    # Dotfiles and dot-directories (/.git/, /.env) are never routes.
    location ~ "/\." {
        include /etc/nginx/security-headers.conf;
        return 404;
    }

    location ~ "^/(api|otel|csp-report|config|remotes)(/|$)" {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # The extension list is spa-rewrite.js's STATIC. Unhashed files (favicons,
    # remote-manifest-entry.json) revalidate.
    location ~* "\.(js|mjs|css|map|json|png|jpg|jpeg|gif|svg|webp|avif|ico|woff|woff2|ttf|txt|xml|webmanifest|html|htm)$" {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/document-headers.conf;
        try_files $uri /index.html;
    }
}
