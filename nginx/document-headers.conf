# The standalone document (/ and the SPA fallback). It loads only same-origin scripts, styles, fonts
# and images (rsbuild.config.ts: no inline scripts or styles; fonts are self-hosted), is never
# framed, and is a demo page with fixture data: kept out of search engines.
include /etc/nginx/security-headers.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Cache-Control "no-cache" always;
